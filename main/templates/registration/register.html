{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Хищные пасти</title>
</head>

<body>

        <div class="wrapper">

            </div>
        </div>
    </div>
</body>

</html>
