{% extends "layout.html" %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="blog-block">
        <ul class="posts-list">
            {% for post in posts %}
            <li>
                <div class="post">
                    <div class="post-title-block">
                        <h2 class="post-title">{{ post.title }}</h2>
                    </div>
                    <div class="post-text">
                        {{ post.text }}
                    </div>
                    <div>
                        <p class="post-date">
                            <b>{{ post.date_posted }}</b>
                        </p>
                    </div>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
